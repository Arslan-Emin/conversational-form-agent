name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only needs to check out the code.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff (same version as requirements-dev.txt)
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Tests never call real APIs (LLM and Jotform are mocked, the embedder is
      # faked), so no secrets are needed. Don't write trace files in CI.
      TRACE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  eval-gate:
    # Compares the newest committed eval run with the accepted baseline (named in
    # evals/BASELINE). No LLM calls and no secrets: the evals are run locally and
    # their result files are committed; this job only checks them.
    name: Eval regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the gate from llm-eval-platform (pinned commit)
        run: pip install "evalplat @ git+https://github.com/Arslan-Emin/llm-eval-platform@1e202ddd55c2e53171af354856718d39f116bc41"
      - name: Gate the newest eval run against the baseline
        run: evalplat gate "evals/results/$(cat evals/BASELINE)" evals/results
